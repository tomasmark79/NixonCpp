name: Static analysis

on:
  push:
    paths:
      - ".github/workflows/static-analysis.yml"
      - ".clang-tidy"
      - "Makefile"
      - "include/**"
      - "meson.build"
      - "meson_options.txt"
      - "nix/**"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "vendor/**"
  pull_request:
    paths:
      - ".github/workflows/static-analysis.yml"
      - ".clang-tidy"
      - "Makefile"
      - "include/**"
      - "meson.build"
      - "meson_options.txt"
      - "nix/**"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "vendor/**"

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v21
        with:
          flakehub: false

      - name: Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v13

      - name: Static analysis
        run: nix develop ./nix --command make check
