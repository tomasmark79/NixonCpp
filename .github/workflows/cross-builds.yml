name: Cross builds

on:
  push:
    paths:
      - ".github/workflows/cross-builds.yml"
      - "Makefile"
      - "README.md"
      - "assets/**"
      - "include/**"
      - "meson.build"
      - "meson_options.txt"
      - "nix/**"
      - "scripts/**"
      - "src/**"
      - "vendor/**"
  pull_request:
    paths:
      - ".github/workflows/cross-builds.yml"
      - "Makefile"
      - "README.md"
      - "assets/**"
      - "include/**"
      - "meson.build"
      - "meson_options.txt"
      - "nix/**"
      - "scripts/**"
      - "src/**"
      - "vendor/**"

jobs:
  cross-builds:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, windows, wasm]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v21
        with:
          flakehub: false

      - name: Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v13

      - name: Cross build (${{ matrix.arch }})
        run: nix develop ./nix#${{ matrix.arch }} --command make cross-${{ matrix.arch }}
